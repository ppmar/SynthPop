[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthpop"
version = "0.1.0"
description = "Synthetic Population Opinion Simulator"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mesa>=3.0.0",
    "networkx>=3.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.9",
    "structlog>=23.2",
    "httpx>=0.25",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
synthpop = "synthpop.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
